[project]
name = "weather-cheddr-weddr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "ruff>=0.14.9",
    "snowflake-connector-python>=4.0.0",
    "sqlfluff>=3.5.0",
    "sqlfluff-templater-dbt>=3.5.0",
    "yamllint>=1.37.1",
]

[dependency-groups]
dev = [
    "apache-airflow==3.1.3",
    "apache-airflow-providers-amazon>=9.17.0",
    "apache-airflow-providers-snowflake>=5.5.1",
    "astronomer-cosmos[dbt-snowflake]>=0.0.5",
    "dbt-core>=1.10.15",
    "dbt-snowflake>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
